---
- name: Enable passwordless sudo for ubuntu user
  hosts: all
  become: true
  tasks:
    - name: Allow ubuntu user to sudo without password
      copy:
        dest: /etc/sudoers.d/ubuntu-nopasswd
        content: "ubuntu ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"